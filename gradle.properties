org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# The app provides the Kotlin standard library at runtime; an extension that bundled its own copy would load
# different kotlin.* classes from the app's and fail at the first call across the boundary.
kotlin.stdlib.default.dependency=false
